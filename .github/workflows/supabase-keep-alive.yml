name: Supabase Keep-Alive

# Impede que o projeto Supabase (plano Free) seja pausado por inatividade.
# O plano Free pausa projetos após ~7 dias sem atividade; aqui disparamos
# requisições reais à API do Supabase a cada 3 dias para registrar activity.
#
# Segredos necessários (Settings > Secrets and variables > Actions):
#   SUPABASE_URL        -> https://xxxx.supabase.co
#   SUPABASE_ANON_KEY   -> chave pública (anon) do projeto

on:
  schedule:
    # Todo dia 1, 4, 7 ... de cada mês às 04:17 UTC (nunca passa de ~4 dias sem ping)
    - cron: "17 4 */3 * *"
  workflow_dispatch: # permite rodar manualmente para teste

permissions:
  contents: read

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping Supabase API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar segredos configurados
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Defina os segredos SUPABASE_URL e SUPABASE_ANON_KEY no repositório."
            exit 1
          fi

      - name: Ping na API (REST + Health)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -uo pipefail

          # Endpoint que registra atividade no projeto e funciona com a anon key.
          # Obs: /rest/v1/ (raiz) exige secret key — por isso consultamos uma tabela.
          ping() {
            local path="$1"
            local code
            code=$(curl -sS -o /tmp/ping.out -w "%{http_code}" \
              --retry 3 --retry-delay 5 --max-time 30 \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H "x-application-name: 2sflow-keep-alive" \
              "$SUPABASE_URL$path" 2>/dev/null) || code=000
            echo "GET $path -> HTTP $code"
            [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
          }

          # 1) Query real no PostgREST (conta como uso do projeto)
          ok=0
          ping "/rest/v1/workspaces?select=id&limit=1" && ok=1

          # 2) Endpoints de saúde: acordam Auth/Realtime e confirmam que está de pé
          ping "/auth/v1/health" && ok=1
          ping "/realtime/v1/api/health" && ok=1

          if [ "$ok" -ne 1 ]; then
            echo "::error::Todos os pings falharam — verifique SUPABASE_URL/SUPABASE_ANON_KEY."
            exit 1
          fi

          echo "Keep-alive OK em $(date -u +%Y-%m-%dT%H:%M:%SZ)"
