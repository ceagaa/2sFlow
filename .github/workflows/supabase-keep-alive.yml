name: Supabase Keep Alive

# Impede que o projeto Supabase seja pausado por inatividade (Free plan pausa após 7 dias sem atividade).
# Faz um ping na API REST do Supabase a cada 3 dias.
on:
  schedule:
    # Todo dia 17 de cada 3 dias, às 04:17 UTC (fora do horário de pico, delay do GitHub Actions)
    - cron: "17 4 */3 * *"
  # Permite rodar manualmente: Actions > Supabase Keep Alive > Run workflow
  workflow_dispatch:

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar segredos configurados
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Defina os secrets SUPABASE_URL e SUPABASE_ANON_KEY no repositório (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Ping na API do Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          # A raiz /rest/v1/ retorna 401 com a anon key; uma consulta de tabela
          # chega ao Postgres (RLS devolve [] sem linhas) e conta como atividade.
          echo "Enviando ping para $SUPABASE_URL ..."
          status=$(curl -sS -o /tmp/response.txt -w "%{http_code}" \
            --retry 5 --retry-delay 10 --retry-all-errors --max-time 60 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/workspaces?select=id&limit=1")
          echo "HTTP $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
            echo "::error::Ping falhou com HTTP $status. Projeto pode estar pausado/restaurando. Veja a resposta:"
            cat /tmp/response.txt
            exit 1
          fi
          echo "Ping OK — projeto ativo. Resposta: $(cat /tmp/response.txt)"
